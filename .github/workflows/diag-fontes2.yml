name: diag-fontes2
on:
  push:
    branches: [diag-prefeituras]
    paths: [scripts/diag-prefeituras/fontes2.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-net --allow-read --allow-write --allow-env scripts/diag-prefeituras/diag.ts fontes2 2>&1 | tail -30
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add scripts/diag-prefeituras/resultado-fontes2.json
          git commit -m "Diagnóstico de fontes novas (agro, Norte Central)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
