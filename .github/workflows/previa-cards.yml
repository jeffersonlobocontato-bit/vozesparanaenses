name: Prévia dos cards do Instagram
on:
  workflow_dispatch:
  push:
    branches: [previa-cards]
permissions:
  contents: write
jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: mkdir -p previas && (deno run -A --node-modules-dir=none scripts/previa-cards.ts 2>&1 | tee previas/log.txt) || true
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f previas && git commit -m "Prévias dos cards" && git push
