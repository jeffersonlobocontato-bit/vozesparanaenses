# Reels "Resumo do dia" do @vozesparanaenses.
# Monta o roteiro com os posts publicados no dia, gera a narração (pt-BR),
# compõe a trilha, renderiza com Remotion e guarda o MP4 como artefato.
# Publica no Instagram na agenda diária (perto das 18h) e quando pedido pela
# entrada `publicar` — desde que exista o secret ZERNIO_API_KEY no repositório.
# Sem o secret, só gera o vídeo (artefato + branch reels-previas).
name: Reels Resumo do Dia

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Dia (AAAA-MM-DD). Vazio = hoje"
        required: false
        default: ""
      ate:
        description: "Só posts publicados até HH:MM (vazio = o dia todo)"
        required: false
        default: ""
      publicar:
        description: "Publicar no Instagram depois de renderizar?"
        type: boolean
        default: false
  # A agenda do GitHub não é garantida: em 26/10/2026 o horário das 17h40
  # simplesmente não disparou. Por isso há horários de reserva; cada um confere
  # antes (job "checar") se o Reels do dia já saiu e, se saiu, não faz nada.
  schedule:
    - cron: "40 20 * * *" # 17h40 em Brasília (principal: posta perto das 18h)
    - cron: "17 21 * * *" # 18h17 reserva
    - cron: "53 21 * * *" # 18h53 reserva
    - cron: "31 22 * * *" # 19h31 última reserva

permissions:
  contents: write

concurrency:
  group: reels-resumo
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      feito: ${{ steps.ja.outputs.feito }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reels/scripts
      - id: ja
        name: Reels de hoje já saiu?
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: node reels/scripts/ja-publicado.mjs ${{ github.event.inputs.data }}

  reels:
    needs: checar
    # Na agenda, só roda se o Reels do dia ainda não saiu; à mão, sempre roda.
    if: ${{ github.event_name != 'schedule' || needs.checar.outputs.feito != 'sim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
    defaults:
      run:
        working-directory: reels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reels/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          npm ci --no-audit --no-fund
          pip install --quiet "edge-tts>=7.2" numpy scipy
      - name: Roteiro do dia
        env:
          REELS_ATE: ${{ github.event.inputs.ate }}
        run: node scripts/montar.mjs ${{ github.event.inputs.data }}
      - name: Narração
        run: python scripts/voz.py
      - name: Trilha e efeitos
        run: python scripts/trilha.py
      - name: Render
        run: |
          npx remotion render ResumoDoDia out/resumo.mp4 --props=public/roteiro.json --concurrency=4 --crf=20
          npx remotion still CapaResumo out/capa.jpg --props=public/roteiro.json --jpeg-quality=92
      - name: Guarda o vídeo
        uses: actions/upload-artifact@v4
        with:
          name: resumo-do-dia
          path: |
            reels/out/resumo.mp4
            reels/out/capa.jpg
            reels/public/roteiro.json
          retention-days: 14
      - name: Prévia no branch reels-previas (só o último vídeo)
        run: |
          mkdir -p /tmp/previa && cp out/resumo.mp4 out/capa.jpg public/roteiro.json /tmp/previa/
          cd /tmp/previa
          git init -q -b reels-previas
          git config user.name "vozes-reels" && git config user.email "reels@vozesparanaenses.com.br"
          git add . && git commit -qm "Prévia do Reels $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" reels-previas
      # Diagnóstico visível na lista de etapas (sem precisar abrir o log):
      # se esta etapa aparecer como executada, o secret não chegou ao job.
      - name: "Aviso: secret ZERNIO_API_KEY ausente (não publica)"
        if: ${{ env.ZERNIO_API_KEY == '' }}
        run: echo "::warning::Crie o secret ZERNIO_API_KEY em Settings > Secrets and variables > Actions > Repository secrets."
      - name: Publica no Instagram
        if: ${{ (github.event.inputs.publicar == 'true' || github.event_name == 'schedule') && env.ZERNIO_API_KEY != '' }}
        run: node scripts/publicar.mjs
