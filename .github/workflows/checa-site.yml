name: checa-site
on:
  push:
    branches: [diag-prefeituras]
    paths: [.github/workflows/checa-site.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > checa-site.txt 2>&1
          date -u
          B=https://vozesparanaenses.com.br
          for rodada in 1 2 3; do
            echo "== rodada $rodada"
            for p in / /oeste /oeste/cidade/toledo /oeste/mulher-e-presa-com-319-ampolas-de-medicamentos-emagrecedores /metropolitana /sitemap.xml /fotos-genericas/pm-viatura-1.jpg; do
              curl -s -o /dev/null -w "%{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} bytes=%{size_download} $p\n" "$B$p?nc=$RANDOM"
            done
          done
          echo "== cabeçalhos da home"
          curl -sI "$B/" | grep -iE "server|cache|cf-|x-|age|via" || true
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add checa-site.txt && git commit -m "resultado checa-site" && git push
