name: fotos-genericas
on:
  push:
    branches: [fotos-genericas]
    paths: [scripts/fotos-genericas/prf.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scripts/fotos-genericas/prf.py 2>&1 | tee scripts/fotos-genericas/log-prf.txt
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add scripts/fotos-genericas
          git commit -m "Candidatas PRF (Flickr prfparana)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
