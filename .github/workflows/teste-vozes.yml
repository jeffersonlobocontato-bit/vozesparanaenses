name: Teste de vozes (amostras)
on: workflow_dispatch
jobs:
  vozes:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - run: pip install edge-tts
      - run: |
          mkdir out && cd out
          for v in pt-BR-AntonioNeural pt-BR-FranciscaNeural pt-BR-ThalitaMultilingualNeural pt-BR-MacerioMultilingualNeural; do
            edge-tts --voice $v --text "Se você cuida da comunicação de uma prefeitura no Paraná, o Vozes Paranaenses dá espaço às trezentas e noventa e nove cidades do estado." --write-media $v.mp3 || true
          done
          git init -q -b amostras-voz && git add . && git -c user.name=bot -c user.email=b@b commit -qm amostras
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" amostras-voz
